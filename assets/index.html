<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gêmeo Digital - Robô Cartesiano</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a1a; font-family: Arial, sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; }
        #info-panel {
            position: absolute; top: 10px; left: 10px; color: white;
            background: rgba(0,0,0,0.7); padding: 15px; border-radius: 8px;
            font-size: 14px; line-height: 1.5; pointer-events: none;
        }
        .status-on { color: #00ff00; font-weight: bold; }
        .status-off { color: #ff3333; }
    </style>
    <!-- Importação do Three.js e OrbitControls via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

<div id="info-panel">
    <h3>Status dos Eixos (Simulação)</h3>
    <div>Eixo X: <span id="pos-x">0</span> mm</div>
    <div>Eixo Y: <span id="pos-y">0</span> mm</div>
    <div>Eixo Z: <span id="pos-z">0</span> mm</div>
</div>

<div id="canvas-container"></div>

<script>
// --- CONFIGURAÇÃO DA CENA THREE.JS ---
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a1a);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 3000);
camera.position.set(600, 500, 800);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
container.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(200, 100, 200);
controls.update();

// --- ILUMINAÇÃO ---
const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(300, 600, 400);
dirLight.castShadow = true;
scene.add(dirLight);

const gridHelper = new THREE.GridHelper(1000, 20, 0x444444, 0x222222);
scene.add(gridHelper);

// --- MATERIAIS ---
const matEstrutura = new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.8, roughness: 0.2 });
const matCarro = new THREE.MeshStandardMaterial({ color: 0x0055ff, metalness: 0.5, roughness: 0.3 });
const matAtuador = new THREE.MeshStandardMaterial({ color: 0xdddddd, metalness: 0.9, roughness: 0.1 });

// --- CONSTRUÇÃO DO ROBÔ (MESHES) ---
// Base/Pórtico Fixos
const baseGeometry = new THREE.BoxGeometry(500, 20, 20);
const meshBaseX1 = new THREE.Mesh(baseGeometry, matEstrutura);
meshBaseX1.position.set(200, 10, 0);
scene.add(meshBaseX1);

const meshBaseX2 = new THREE.Mesh(baseGeometry, matEstrutura);
meshBaseX2.position.set(200, 10, 430);
scene.add(meshBaseX2);

// Eixo X (Carro Móvel do Ponte)
const carroXGeom = new THREE.BoxGeometry(40, 40, 470);
const meshCarroX = new THREE.Mesh(carroXGeom, matCarro);
scene.add(meshCarroX);

// Eixo Y (Carro Transversal)
const carroYGeom = new THREE.BoxGeometry(60, 50, 60);
const meshCarroY = new THREE.Mesh(carroYGeom, matCarro);
scene.add(meshCarroY);

// Eixo Z (Atuador Vertical)
const carroZGeom = new THREE.BoxGeometry(20, 200, 20);
const meshCarroZ = new THREE.Mesh(carroZGeom, matAtuador);
scene.add(meshCarroZ);


// --- LÓGICA DE MOVIMENTAÇÃO E CURSOS ---
const cursoMaximoX = 430; 
const cursoMaximoY = 430; 
const cursoMaximoZ = 155; 

// Velocidades de interpolação mantidas conforme sua referência
const velocidadeX = 1.0;   
const velocidadeY = 1.0;   
const velocidadeZ = 0.8;   

let deslocamentoAtualX = 0;
let deslocamentoAtualY = 0;
let deslocamentoAtualZ = 0;

let alvoX = Math.random() * cursoMaximoX;
let alvoY = Math.random() * cursoMaximoY;
let alvoZ = Math.random() * cursoMaximoZ;

function gerarNovosAlvosAleatorios() {
    alvoX = Math.round(Math.random() * cursoMaximoX);
    alvoY = Math.round(Math.random() * cursoMaximoY);
    alvoZ = Math.round(Math.random() * cursoMaximoZ);
}

// Sorteia novas coordenadas aleatórias no curso total a cada 4 segundos
setInterval(gerarNovosAlvosAleatorios, 4000);

function animateThreeJS() {
    requestAnimationFrame(animateThreeJS);

    // Interpolação Eixo X
    if (Math.abs(alvoX - deslocamentoAtualX) > velocidadeX) {
        deslocamentoAtualX += (deslocamentoAtualX < alvoX) ? velocidadeX : -velocidadeX;
    } else {
        deslocamentoAtualX = alvoX;
    }

    // Interpolação Eixo Y
    if (Math.abs(alvoY - deslocamentoAtualY) > velocidadeY) {
        deslocamentoAtualY += (deslocamentoAtualY < alvoY) ? velocidadeY : -velocidadeY;
    } else {
        deslocamentoAtualY = alvoY;
    }

    // Interpolação Eixo Z
    if (Math.abs(alvoZ - deslocamentoAtualZ) > velocidadeZ) {
        deslocamentoAtualZ += (deslocamentoAtualZ < alvoZ) ? velocidadeZ : -velocidadeZ;
    } else {
        deslocamentoAtualZ = alvoZ;
    }

    // Atualização de posições 3D na cena
    if (meshCarroX) {
        meshCarroX.position.x = -12;
        meshCarroX.position.z = 0 + deslocamentoAtualX;
    }

    if (meshCarroY) {
        meshCarroY.position.x = 100 + deslocamentoAtualY;
        meshCarroY.position.z = 44 + deslocamentoAtualX;
    }

    if (meshCarroZ) {
        meshCarroZ.position.x = 180 + deslocamentoAtualY;
        meshCarroZ.position.y = (440 - deslocamentoAtualZ);
        meshCarroZ.position.z = 182 + deslocamentoAtualX;
    }

    // Atualização do painel de telemetria
    document.getElementById('pos-x').innerText = Math.round(deslocamentoAtualX);
    document.getElementById('pos-y').innerText = Math.round(deslocamentoAtualY);
    document.getElementById('pos-z').innerText = Math.round(deslocamentoAtualZ);

    controls.update();
    renderer.render(scene, camera);
}

// Responsividade da janela
window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

// Inicializa a animação
animateThreeJS();
</script>
</body>
</html>
