<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Restrito - Control Hub</title>

    <!-- Preload atualizado apontando para a pasta /assets/ -->
    <!--<link rel="preload" href="/assets/bg-supervisorio.webp" as="image" type="image/webp"> -->

    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }

        body {
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
            background-color: #0d1117;
            background-image: linear-gradient(rgba(13, 17, 23, 0.45), rgba(13, 17, 23, 0.55)), url('assets/bg-supervisorio.webp');
            background-repeat: no-repeat;
            background-position: center center;
            background-size: cover;
        }

        #particles-js {
            position: absolute;
            width: 80%;
            height: 85%;
            top: 5%;
            left: 0;
            z-index: 1;
            pointer-events: none;
        }

        .login-card {
            position: relative;
            z-index: 2;
            background: rgba(18, 24, 38, 0.75);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(0, 242, 254, 0.25);
            border-top: 4px solid #00f2fe;
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7),
                        0 0 20px rgba(0, 242, 254, 0.15);
            animation: fadeInCard 1.5s ease-out forwards;
        }

        @keyframes fadeInCard {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-area { text-align: center; margin-bottom: 30px; }
        .logo-area h2 { 
            font-size: 1.5rem; 
            color: #f0f6fc; 
            font-weight: 600; 
            letter-spacing: 1.5px; 
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
        }
        .logo-area p { font-size: 0.85rem; color: #8b949e; margin-top: 5px; }

        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.85rem; color: #8b949e; margin-bottom: 8px; font-weight: 500; }

        input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(13, 17, 23, 0.8);
            border: 1px solid rgba(48, 54, 61, 0.8);
            border-radius: 6px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
        }

        input:focus { 
            border-color: #00f2fe; 
            box-shadow: 0 0 10px rgba(0, 242, 254, 0.4); 
            background: rgba(13, 17, 23, 0.95);
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #0052d4, #4364f7, #00f2fe);
            border: none;
            border-radius: 6px;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(0, 82, 212, 0.4);
        }

        .btn-login:hover { 
            opacity: 0.95; 
            box-shadow: 0 6px 20px rgba(0, 242, 254, 0.5);
            transform: translateY(-1px);
        }

        .error-msg { color: #ff7b72; font-size: 0.85rem; text-align: center; margin-top: 15px; display: none; }
    </style>
</head>
<body>

    <div id="particles-js"></div>

    <div class="login-card">
        <div class="logo-area">
            <h2>PROJETOS DE AUTOMAÇÃO</h2>
            <p>Dr. Júlio César M. Fernandes</p>
        </div>
        <form id="formLogin">
            <div class="form-group">
                <label for="usuario">Usuário</label>
                <input type="text" id="usuario" required placeholder="Digite seu usuário">
            </div>
            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-login">ACESSAR PAINEL</button>
            <div id="erro" class="error-msg">Usuário ou senha inválidos.</div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

    <script>
        particlesJS('particles-js', {
            "particles": {
                "number": {
                    "value": 130,
                    "density": { "enable": true, "value_area": 500 }
                },
                "color": { "value": ["#00f2fe", "#00d2ff", "#ffffff"] },
                "shape": { "type": "circle" },
                "opacity": {
                    "value": 0.85,
                    "random": true,
                    "anim": { 
                        "enable": true, 
                        "speed": 2, 
                        "opacity_min": 0.05, 
                        "sync": false 
                    }
                },
                "size": {
                    "value": 4.5,
                    "random": true,
                    "anim": { 
                        "enable": true, 
                        "speed": 2, 
                        "size_min": 0.5, 
                        "sync": false 
                    }
                },
                "line_linked": {
                    "enable": true,
                    "distance": 110,
                    "color": "#00f2fe",
                    "opacity": 0.2,
                    "width": 1
                },
                "move": {
                    "enable": true,
                    "speed": 1.4,
                    "direction": "top-left",
                    "random": true,
                    "straight": false,
                    "out_mode": "out",
                    "bounce": false
                }
            },
            "interactivity": {
                "detect_on": "canvas",
                "events": {
                    "onhover": { "enable": true, "mode": "bubble" },
                    "onclick": { "enable": true, "mode": "push" },
                    "resize": true
                },
                "modes": {
                    "bubble": { "distance": 180, "size": 6, "duration": 2, "opacity": 1 },
                    "push": { "particles_nb": 4 }
                }
            },
            "retina_detect": true
        });

        document.getElementById('formLogin').addEventListener('submit', async (e) => {
            e.preventDefault();
            const usuario = document.getElementById('usuario').value;
            const senha = document.getElementById('senha').value;
            const msgErro = document.getElementById('erro');

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario, senha })
                });

                const data = await res.json();
                if (res.ok && data.token) {
                    localStorage.setItem('auth_token', data.token);
                    window.location.href = '/dashboard?token=' + data.token;
                } else {
                    msgErro.style.display = 'block';
                }
            } catch (err) {
                msgErro.textContent = "Erro ao conectar com o servidor.";
                msgErro.style.display = 'block';
            }
        });
    </script>
</body>
</html>
